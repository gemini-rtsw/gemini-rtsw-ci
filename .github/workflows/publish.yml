name: Publish to rpm-repo:latest

# Single-writer publish step. Called by a repo's CI after the build legs have
# pushed their per-package scratch tags. Rebuilds the combined yum image
# (rpm-repo:latest) from the full scratch-tag set.
#
# Caller wires it as a final job:
#   publish:
#     needs: build
#     uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/publish.yml@main-el8
#     secrets: inherit

on:
  workflow_call:
    inputs:
      fast_publish:
        description: >-
          Use the incremental publish path (fast_publish.sh) instead of a full
          rebuild. Left false, the FAST_PUBLISH org/repo variable decides, and
          with that unset too the script simply delegates to sync_repo.sh --
          i.e. exactly the old behaviour. Set true on ONE repo to try it there
          first; set the variable once it should apply everywhere.
        type: boolean
        default: false
      publish_tag:
        description: >-
          Which tag to publish. Override to exercise the whole pipeline --
          real tag set, real image -- WITHOUT touching :latest. Seed the
          throwaway tag first (server-side, no data transfer):
            docker buildx imagetools create \
              -t ghcr.io/gemini-rtsw/rpm-repo:<tag> \
              ghcr.io/gemini-rtsw/rpm-repo:latest
          Otherwise the tag does not exist, the fast path falls back, and the
          fallback does a full 8GB rebuild -- the thing being avoided.
        type: string
        default: latest
      repo_ref:
        description: >-
          Branch of gemini-rtsw-repo to run the publish scripts from. For
          testing unmerged changes before opening a PR.
        type: string
        default: master

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Rebuild and push rpm-repo:latest
    runs-on: ubuntu-latest
    steps:
      # Aggressively reclaim runner disk (~30-40GB) before pulling tags and
      # assembling the multi-GB image.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # fast_publish.sh adds only the RPMs :latest is missing and docker-commits
      # the result, instead of rebuilding all ~8GB of bucket layers from
      # nginx:alpine. It falls through to sync_repo.sh on ANY doubt, and with
      # FAST_PUBLISH unset it delegates immediately -- so this step behaves
      # exactly as before until the variable below is set to 1.
      - name: Publish from the scratch tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          # Explicit input wins; otherwise the org/repo variable; otherwise off.
          FAST_PUBLISH: ${{ inputs.fast_publish && '1' || vars.FAST_PUBLISH || '0' }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          df -h /
          git clone --branch "${{ inputs.repo_ref }}" \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/gemini-rtsw/gemini-rtsw-repo.git
          cd gemini-rtsw-repo
          git log --oneline -1
          # Tolerate a gemini-rtsw-repo ref that predates fast_publish.sh, so
          # this workflow can merge before that script does without breaking
          # every repo's publish in the gap.
          chmod +x sync_repo.sh
          if [ -f fast_publish.sh ]; then
            chmod +x fast_publish.sh
            ./fast_publish.sh
          else
            echo "fast_publish.sh not present on '${{ inputs.repo_ref }}'; using sync_repo.sh"
            ./sync_repo.sh
          fi
