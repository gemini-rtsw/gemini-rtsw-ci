name: Publish to rpm-repo:latest

# Single-writer publish step. Called by a repo's CI after the build legs have
# pushed their per-package scratch tags. Rebuilds the combined yum image
# (rpm-repo:latest) from the full scratch-tag set.
#
# Caller wires it as a final job:
#   publish:
#     needs: build
#     uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/publish.yml@main-el8
#     secrets: inherit

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Rebuild and push rpm-repo:latest
    runs-on: ubuntu-latest
    steps:
      # Aggressively reclaim runner disk (~30-40GB) before pulling tags and
      # assembling the multi-GB image.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild :latest from all scratch tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          df -h /
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/gemini-rtsw/gemini-rtsw-repo.git
          cd gemini-rtsw-repo
          chmod +x sync_repo.sh
          ./sync_repo.sh
