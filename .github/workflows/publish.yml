name: Publish to rpm-repo per-EL images

# Single-writer publish step. Called by a repo's CI after the build legs have
# pushed their per-package scratch tags. Rebuilds the per-EL yum images
# (rpm-repo:latest-el8 / :latest-el9) from the full scratch-tag set.
#
# el8 and el9 run as SEPARATE matrix jobs (separate runners) so each runner
# only assembles ONE multi-GB image on its own fresh disk -- avoiding the
# runner-disk overflow that hit when both were built on one runner.
#
# Caller wires it as a final job:
#   publish:
#     needs: build
#     uses: gemini-rtsw/gemini-rtsw-ci/.github/workflows/publish.yml@main-el8
#     secrets: inherit

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Rebuild :latest-el${{ matrix.el }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        el: ['8', '9']
    steps:
      # Aggressively reclaim runner disk (~30-40GB) before pulling tags and
      # assembling a multi-GB image (the build context alone is several GB).
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild :latest-el${{ matrix.el }} from scratch tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          df -h /
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/gemini-rtsw/gemini-rtsw-repo.git
          cd gemini-rtsw-repo
          chmod +x sync_repo.sh
          # Build only this EL's image (separate runner per EL).
          ./sync_repo.sh ${{ matrix.el }}
