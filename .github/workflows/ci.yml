name: Build RPM and Docker Image

on:
  workflow_call:
    inputs:
      is_prod:
        description: 'Production build'
        required: false
        default: false
        type: boolean
      scripts_dir:
        description: 'Path to gemini-rtsw-ci scripts'
        required: false
        default: 'gemini-rtsw-ci'
        type: string
      el_version:
        description: 'Target EL (Rocky) major version: 8 or 9'
        required: false
        default: '8'
        type: string
      profile:
        description: "Build profile: epics (default, unchanged) or lightweight (no gemini-ade, no rpm-repo dep container, no dev image)"
        required: false
        default: 'epics'
        type: string
      builder_image:
        description: 'Override the build base image (default rockylinux:<el_version>)'
        required: false
        default: ''
        type: string
      spec_path:
        description: 'Spec file path, if it is neither ./*.spec nor SPECS/*.spec'
        required: false
        default: ''
        type: string
      app_image:
        description: "Path to a Dockerfile for this repo's APPLICATION image (not the dev image). Built and pushed tagged from the spec version. Empty = no app image."
        required: false
        default: ''
        type: string
      register:
        description: "Push the RPM scratch tag to rpm-repo. Set false for PR/dev builds whose NVRA does not change between commits."
        required: false
        default: true
        type: boolean
      verify_cmd:
        description: 'Command run after the build, from the repo root, with the RPMs in rpms/'
        required: false
        default: ''
        type: string
      dev_image_suffix:
        description: "Suffix for the published dev image tags, e.g. '-test' to try a pipeline change without overwriting el<N>-latest-devel."
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-rpm:
    name: Build RPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 50

      # Aggressively reclaim runner disk (~30-40GB). The RTEMS cross-compile +
      # pulling the per-EL rpm-repo image fills the default runner '/' and the
      # build dies with "No space left on device" (dnf dep install, ld link, or
      # the multi-GB build context).
      # Only the epics profile pulls the multi-GB rpm-repo image; reclaiming
      # 30-40GB takes minutes a lightweight build has no reason to spend.
      - name: Free up disk space
        if: inputs.profile != 'lightweight'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds the environment once, then reuses it for the RPM AND the dev
      # image (build_rpm.sh stages 1-3). There is no separate build-docker job
      # any more: it rebuilt the same environment on a second runner, from the
      # -devel RPM runtime Requires rather than the spec BuildRequires, which
      # produced dev images with no toolchain for any package whose -devel did
      # not happen to list one.
      - name: Build RPM and dev image
        env:
          BUILDER_IMAGE: ${{ inputs.builder_image }}
          SPEC_PATH: ${{ inputs.spec_path }}
          PROFILE: ${{ inputs.profile }}
          DEV_IMAGE_SUFFIX: ${{ inputs.dev_image_suffix }}
        run: |
          chmod +x ${{ inputs.scripts_dir }}/build_rpm.sh
          if [ "${{ inputs.is_prod }}" = "true" ]; then
            ${{ inputs.scripts_dir }}/build_rpm.sh --el ${{ inputs.el_version }} --prod
          else
            ${{ inputs.scripts_dir }}/build_rpm.sh --el ${{ inputs.el_version }}
          fi

      # Package-specific checks the generic build cannot know about -- e.g. that
      # a unit is pinned to the right image, or that an upgrade preserves
      # /etc/sysconfig. Skipped entirely when unset.
      - name: Verify RPM
        if: inputs.verify_cmd != ''
        run: ${{ inputs.verify_cmd }}

      # Before the RPM is registered, deliberately: a published RPM whose unit
      # pins an image that was never pushed installs cleanly and then fails at
      # the next restart, on the deployed host, with nothing linking the two.
      - name: Build and push application image
        if: inputs.app_image != '' && github.event_name != 'pull_request'
        run: |
          chmod +x ${{ inputs.scripts_dir }}/build_app_image.sh
          ${{ inputs.scripts_dir }}/build_app_image.sh --dockerfile "${{ inputs.app_image }}"

      # On a pull request the image is built but never pushed, so a broken
      # Dockerfile still fails the PR rather than only failing after merge.
      - name: Build application image (no push)
        if: inputs.app_image != '' && github.event_name == 'pull_request'
        run: |
          chmod +x ${{ inputs.scripts_dir }}/build_app_image.sh
          ${{ inputs.scripts_dir }}/build_app_image.sh --dockerfile "${{ inputs.app_image }}" --no-push

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          # Scope by EL so matrix legs (el8/el9) don't collide on one artifact
          # name -- a shared name means whoever downloads it may get either EL.
          name: rpms-el${{ inputs.el_version }}
          path: rpms/*.rpm

      # A package whose NVRA is fixed by its spec (rather than carrying a git
      # hash) produces the SAME tag on every commit, so an unreleased dev build
      # would overwrite the released one and the next publish would ship it.
      # Such repos pass register: false on ordinary CI and true only on release.
      - name: Push RPM scratch tag (no :latest rebuild)
        if: inputs.register
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # Clone the rpm-repo tools (upload-rpm.sh + sync_repo.sh live here).
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/gemini-rtsw/gemini-rtsw-repo.git
          cd gemini-rtsw-repo

          # --tag-only: push the per-package, per-EL scratch tag and STOP.
          # The :latest rebuild happens ONCE in the caller's `publish` job
          # (publish.yml), which runs after BOTH the el8 and el9 matrix legs
          # finish -- so there is a single writer of :latest and no race.
          chmod +x upload-rpm.sh
          ./upload-rpm.sh --tag-only ../rpms/*.rpm
