name: Build RPM and Docker Image

on:
  workflow_call:
    inputs:
      is_prod:
        description: 'Production build'
        required: false
        default: false
        type: boolean
      scripts_dir:
        description: 'Path to gemini-rtsw-ci scripts'
        required: false
        default: 'gemini-rtsw-ci'
        type: string
      el_version:
        description: 'Target EL (Rocky) major version: 8 or 9'
        required: false
        default: '8'
        type: string
      profile:
        description: "Build profile: epics (default, unchanged) or lightweight (no gemini-ade, no rpm-repo dep container, no dev image)"
        required: false
        default: 'epics'
        type: string
      builder_image:
        description: 'Override the build base image (default rockylinux:<el_version>)'
        required: false
        default: ''
        type: string
      spec_path:
        description: 'Spec file path, if it is neither ./*.spec nor SPECS/*.spec'
        required: false
        default: ''
        type: string
      register:
        description: "Push the RPM scratch tag to rpm-repo. Set false for PR/dev builds whose NVRA does not change between commits."
        required: false
        default: true
        type: boolean
      verify_cmd:
        description: 'Command run after the build, from the repo root, with the RPMs in rpms/'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-rpm:
    name: Build RPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 50

      # Aggressively reclaim runner disk (~30-40GB). The RTEMS cross-compile +
      # pulling the per-EL rpm-repo image fills the default runner '/' and the
      # build dies with "No space left on device" (dnf dep install, ld link, or
      # the multi-GB build context).
      # Only the epics profile pulls the multi-GB rpm-repo image; reclaiming
      # 30-40GB takes minutes a lightweight build has no reason to spend.
      - name: Free up disk space
        if: inputs.profile != 'lightweight'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build RPM
        env:
          BUILDER_IMAGE: ${{ inputs.builder_image }}
          SPEC_PATH: ${{ inputs.spec_path }}
          PROFILE: ${{ inputs.profile }}
        run: |
          chmod +x ${{ inputs.scripts_dir }}/build_rpm.sh
          if [ "${{ inputs.is_prod }}" = "true" ]; then
            ${{ inputs.scripts_dir }}/build_rpm.sh --el ${{ inputs.el_version }} --prod
          else
            ${{ inputs.scripts_dir }}/build_rpm.sh --el ${{ inputs.el_version }}
          fi

      # Package-specific checks the generic build cannot know about -- e.g. that
      # a unit is pinned to the right image, or that an upgrade preserves
      # /etc/sysconfig. Skipped entirely when unset.
      - name: Verify RPM
        if: inputs.verify_cmd != ''
        run: ${{ inputs.verify_cmd }}

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          # Scope by EL so matrix legs (el8/el9) don't collide on one artifact
          # name -- otherwise the docker job could download the wrong EL's RPMs.
          name: rpms-el${{ inputs.el_version }}
          path: rpms/*.rpm

      # A package whose NVRA is fixed by its spec (rather than carrying a git
      # hash) produces the SAME tag on every commit, so an unreleased dev build
      # would overwrite the released one and the next publish would ship it.
      # Such repos pass register: false on ordinary CI and true only on release.
      - name: Push RPM scratch tag (no :latest rebuild)
        if: inputs.register
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # Clone the rpm-repo tools (upload-rpm.sh + sync_repo.sh live here).
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/gemini-rtsw/gemini-rtsw-repo.git
          cd gemini-rtsw-repo

          # --tag-only: push the per-package, per-EL scratch tag and STOP.
          # The :latest rebuild happens ONCE in the caller's `publish` job
          # (publish.yml), which runs after BOTH the el8 and el9 matrix legs
          # finish -- so there is a single writer of :latest and no race.
          chmod +x upload-rpm.sh
          ./upload-rpm.sh --tag-only ../rpms/*.rpm

  # Skipped for lightweight packages: the dev container exists to give an EPICS
  # developer a toolchain, and a package with no C build has no use for one.
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-rpm
    if: inputs.profile != 'lightweight' 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The dev-image build pulls the rpm-repo (~6GB) + installs the full dep
      # set into the container; reclaim runner disk first or it runs out (~1GB
      # short observed).
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: rpms-el${{ inputs.el_version }}
          path: rpms/

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          chmod +x ${{ inputs.scripts_dir }}/build_docker.sh
          if [ "${{ inputs.is_prod }}" = "true" ]; then
            ${{ inputs.scripts_dir }}/build_docker.sh --el ${{ inputs.el_version }} --prod
          else
            ${{ inputs.scripts_dir }}/build_docker.sh --el ${{ inputs.el_version }}
          fi
