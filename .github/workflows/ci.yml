name: Build RPM and Docker Image

on:
  workflow_call:
    inputs:
      is_prod:
        description: 'Production build'
        required: false
        default: false
        type: boolean
      scripts_dir:
        description: 'Path to gemini-rtsw-ci scripts'
        required: false
        default: 'gemini-rtsw-ci'
        type: string
      el_version:
        description: 'Target EL (Rocky) major version: 8 or 9'
        required: false
        default: '8'
        type: string

permissions:
  contents: read
  packages: write

env:
  RPM_REPO_IMAGE: ghcr.io/gemini-rtsw/rpm-repo:latest

jobs:
  build-rpm:
    name: Build RPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 50

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build RPM
        run: |
          chmod +x ${{ inputs.scripts_dir }}/build_rpm.sh
          if [ "${{ inputs.is_prod }}" = "true" ]; then
            ${{ inputs.scripts_dir }}/build_rpm.sh --el ${{ inputs.el_version }} --prod
          else
            ${{ inputs.scripts_dir }}/build_rpm.sh --el ${{ inputs.el_version }}
          fi

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          # Scope by EL so matrix legs (el8/el9) don't collide on one artifact
          # name -- otherwise the docker job could download the wrong EL's RPMs.
          name: rpms-el${{ inputs.el_version }}
          path: rpms/*.rpm

      - name: Push RPM scratch tag (no :latest rebuild)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # Clone the rpm-repo tools (upload-rpm.sh + sync_repo.sh live here).
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/gemini-rtsw/gemini-rtsw-repo.git
          cd gemini-rtsw-repo

          # --tag-only: push the per-package, per-EL scratch tag and STOP. The
          # :latest rebuild happens once in the separate publish job below, so
          # parallel build legs (el8/el9) never race on :latest.
          chmod +x upload-rpm.sh
          ./upload-rpm.sh --tag-only ../rpms/*.rpm

  publish:
    name: Publish to rpm-repo:latest
    runs-on: ubuntu-latest
    needs: build-rpm
    # Serialize the :latest rebuild. el8 and el9 are SEPARATE workflow_call
    # runs of THIS reusable workflow, so `needs:` can't order them -- but a
    # reusable workflow's concurrency group is scoped to the CALLER repo, and
    # both legs share one caller, so this constant key makes the el8 and el9
    # publish jobs queue instead of racing on the single mutable :latest tag.
    # cancel-in-progress:false so a queued publish is never dropped.
    #
    # CAVEAT: concurrency is per-repo, so this does NOT serialize publishes
    # across DIFFERENT repos building at the same time. Those can still race on
    # :latest -- but the loser's RPMs survive in their scratch tags and are
    # re-merged by the next sync_repo.sh, so nothing is lost (it may just be
    # briefly absent from :latest). The common case we hit -- el8 vs el9 of one
    # package -- is fully fixed here.
    concurrency:
      group: rpm-repo-publish
      cancel-in-progress: false
    steps:
      - name: Rebuild and push rpm-repo:latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/gemini-rtsw/gemini-rtsw-repo.git
          cd gemini-rtsw-repo

          # sync_repo.sh is the single writer of :latest: it pulls EVERY rpm-*
          # scratch tag (incl. the one this run just pushed) + the old :latest,
          # runs createrepo, and pushes :latest.
          chmod +x sync_repo.sh
          docker login ghcr.io -u "$GITHUB_ACTOR" -p "$GITHUB_TOKEN"
          ./sync_repo.sh

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-rpm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: rpms-el${{ inputs.el_version }}
          path: rpms/

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          chmod +x ${{ inputs.scripts_dir }}/build_docker.sh
          if [ "${{ inputs.is_prod }}" = "true" ]; then
            ${{ inputs.scripts_dir }}/build_docker.sh --el ${{ inputs.el_version }} --prod
          else
            ${{ inputs.scripts_dir }}/build_docker.sh --el ${{ inputs.el_version }}
          fi
