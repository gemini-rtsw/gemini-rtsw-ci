name: Build RPM and Docker Image

on:
  workflow_call:
    inputs:
      is_prod:
        description: 'Production build'
        required: false
        default: false
        type: boolean
      scripts_dir:
        description: 'Path to gemini-rtsw-ci scripts'
        required: false
        default: 'gemini-rtsw-ci'
        type: string
      el_version:
        description: 'Target EL (Rocky) major version: 8 or 9'
        required: false
        default: '8'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-rpm:
    name: Build RPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 50

      # Free ~25-30GB by removing preinstalled toolchains this build never
      # uses. The RTEMS cross-compile + pulling the ~6GB rpm-repo:latest fills
      # the default runner '/' and the build dies with "No space left on
      # device" (during dnf install of deps, or the final ld link). This is a
      # stopgap until rpm-repo:latest is split into per-EL images (each ~half).
      - name: Free up disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android \
            /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build RPM
        run: |
          chmod +x ${{ inputs.scripts_dir }}/build_rpm.sh
          if [ "${{ inputs.is_prod }}" = "true" ]; then
            ${{ inputs.scripts_dir }}/build_rpm.sh --el ${{ inputs.el_version }} --prod
          else
            ${{ inputs.scripts_dir }}/build_rpm.sh --el ${{ inputs.el_version }}
          fi

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          # Scope by EL so matrix legs (el8/el9) don't collide on one artifact
          # name -- otherwise the docker job could download the wrong EL's RPMs.
          name: rpms-el${{ inputs.el_version }}
          path: rpms/*.rpm

      - name: Push RPM scratch tag (no :latest rebuild)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # Clone the rpm-repo tools (upload-rpm.sh + sync_repo.sh live here).
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/gemini-rtsw/gemini-rtsw-repo.git
          cd gemini-rtsw-repo

          # --tag-only: push the per-package, per-EL scratch tag and STOP.
          # The :latest rebuild happens ONCE in the caller's `publish` job
          # (publish.yml), which runs after BOTH the el8 and el9 matrix legs
          # finish -- so there is a single writer of :latest and no race.
          chmod +x upload-rpm.sh
          ./upload-rpm.sh --tag-only ../rpms/*.rpm

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-rpm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: rpms-el${{ inputs.el_version }}
          path: rpms/

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          chmod +x ${{ inputs.scripts_dir }}/build_docker.sh
          if [ "${{ inputs.is_prod }}" = "true" ]; then
            ${{ inputs.scripts_dir }}/build_docker.sh --el ${{ inputs.el_version }} --prod
          else
            ${{ inputs.scripts_dir }}/build_docker.sh --el ${{ inputs.el_version }}
          fi
